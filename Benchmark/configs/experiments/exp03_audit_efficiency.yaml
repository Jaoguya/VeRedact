# Experiment 3 — audit and verification efficiency (VeRedact-optimize.tex). Fig. 5.
experiment:
  id: exp03_audit_efficiency
  paper: [fig:exp3_audit]
  # VeRedact-PQ (SAVER), its variants Shared-Evidence and Per-Record, and the schemes with an audit path
  systems: [veredact, veredact-shared-evidence, veredact-per-record, S13, S1]
  n_Q: [10, 100, 1000, 10000]   # [DERIVED] manuscript 10..10^4 (author 2026-10-24: follow VeRedact-optimize.tex)
  records_per_batch: [1, 8, 64]  # [PROPOSED] evidence-sharing axis (manuscript: 'varying the number of returned
                                #   records that share authorization, transition, checkpoint dependencies');
                                #   1 = no sharing, 64 = veredact.reference_batch (default)
  samples_per_point: 30         # [PROPOSED] audit queries per (system, records per batch, n_Q) in the one run
  samples_override:             # [METHOD] fewer queries where one costs minutes to hours (same for every scheme)
    S13: {"10000": 5}           # S13 builds one RSA-accumulator non-membership witness per record (author
                                #   decision 2026-10-04: 5 at 10^4)
