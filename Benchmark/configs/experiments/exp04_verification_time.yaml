# Experiment 4 — verification time, auditor side, with fault injection. Fig. 6.
experiment:
  id: exp04_verification_time
  paper: [fig:exp4_verify]
  systems: [veredact, S13, S1]
  n_Q: [10, 100, 1000, 10000, 100000]  # [DERIVED] manuscript 10..10^4; 10^5 added (author decision 2026-10-17)
  levels: [normal]              # [METHOD] routine (normal) audit only (author decision 2026-10-04)
  inject_fractions: [0.01, 0.05, 0.10]       # [DERIVED] manuscript [1%-10%]
  samples_per_point: 30         # [PROPOSED] verified responses per (system, n_Q, level, fraction) in the one run
  samples_override:             # [METHOD] n_Q = 10^5: 5 per point for every scheme (S1 ~5 min per verification;
    S13: {"100000": 5}          #   author decision 2026-10-19: one run)
    S1: {"100000": 5}
    veredact: {"100000": 5}
