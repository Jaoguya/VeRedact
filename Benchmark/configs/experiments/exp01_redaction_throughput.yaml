# Experiment 1 — redaction latency and throughput (Phases 3-5, submission -> finalized checkpoint). Fig. 3.
experiment:
  id: exp01_redaction_throughput
  paper: [fig:exp1_redaction]
  # #5 redesign (2026-11-08): VeRedact-PQ and Refs. [1], [13], [27], [34] only. The ablation variants
  # (Per-Request, Fixed-Batch, CORA-No-SFMR) are dropped (Ppdfd, #5 owner); veredact.VARIANTS keeps them runnable
  systems: [veredact, S1, S13, S27, S34]
  rates: [25, 50, 100, 250, 500, 750, 1000]  # [PROPOSED] #5 step 2: 25-1,000 req/s, dense around saturation
                                #   (the 3 Nov run saturated every system above ~500 req/s)
  fault_fraction: 0.20          # [PROPOSED] #5 step 2: 20 % invalid requests (threat model: replayed / stale /
  fault_kinds: [stale, absent]  #   nonexistent targets), 10 % stale + 10 % absent, the same trace for every system
  zipf_sweep: [0.0, 0.4, 0.8, 1.2]           # [DERIVED] manuscript Exp. 1: |Omega_e|, PQCH adaptations, F_e per 1,000
  zipf_rate: 100                # [DERIVED] manuscript: skew sweep "at a fixed arrival rate" = its lowest rate [100]
                                #   (author decision 2026-10-04; S13/S34 saturate there, Fig. 3(c) counts every
                                #   finalized redaction of the point)
  duration_s: 60                # [PROPOSED] steady-state window per point
  warmup_s: 10                  # [METHOD] discarded before measuring
  subwindows: 6                 # [METHOD] hybrid plan (2026-10-31): Exp. 1 runs once; throughput CI over 6 x 10 s
  requester_cores: 4            # [METHOD] physical cores (both hyperthreads) for requester processes; the system
                                #   (VPS workers, executor, Besu validators) is pinned to the remaining cores.
                                #   Audit A3: co-located requester proving made VeRedact-PQ's round 4x slower (82 ms
                                #   alone vs 338 ms) and biased Fig. 3 against it; baselines' requesters do no proving
  requester_processes: 8        # [METHOD] forked requester processes (= vCPUs of requester_cores)
  provers: []                   # [METHOD] audit A4: "host:port" of remote prover services (scripts/prover_service.py);
                                #   non-empty -> requesters prove on those machines and the system keeps every core
                                #   (deploy/aws/provision_provers.sh fills it in at run time)
  client_threads: 16            # [PROPOSED] requester threads that sign + prove (= vcpus; single-core proofs);
                                #   the achieved rate is recorded and a client-bound point is reported as such
  saturation_tolerance: 0.10    # [PROPOSED] a point is NOTED saturated when decided/offered or on-time < 1 - tol;
                                #   every rate runs for every system (author rule 2026-10-05: no capped lines)
  drain_s: 30                   # [PROPOSED] wait for in-flight requests after the window; the rest are recorded
