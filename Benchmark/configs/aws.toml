# AWS experiment server. Read by deploy/aws/*.sh through deploy/aws/aws_config.py.
# Credentials are NOT stored here: scripts use the AWS CLI profile below (aws configure --profile <name>).

[aws]
profile = "veredact"             # AWS CLI profile with EC2 permissions
region = "ap-southeast-1"        # Singapore (closest to Thailand)
instance_type = "r7i.4xlarge"    # = configs/base.yaml environment.instance_type (16 vCPU / 128 GiB; c7i.4xlarge with
                                 #   32 GiB until 2026-10-18: out of memory at the 10^6-transaction ledger)
volume_gb = 100
# Ubuntu 24.04 LTS, resolved at launch from the public SSM parameter (no hard-coded AMI id)
ami_ssm_parameter = "/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id"
key_name = "veredact-bench"      # EC2 key pair; created by provision_ec2.sh if missing (saved to ~/.ssh/)
ssh_user = "ubuntu"
ssh_cidr = "auto"                # "auto" = your current public IP/32 only
name_tag = "veredact-bench"

[repo]
url = "https://github.com/Jaoguya/VeRedact.git"
branch = "main"
remote_dir = "/opt/veredact"

[besu]
# Network shape (validators, block period, netem delay, RPC port) comes from config/<tier>.toml [ledger].
image = "hyperledger/besu:25.6.0"
# Transaction pool: pipelined anchoring keeps thousands of transactions from ONE sender in flight. The
# default pools cap per-sender transactions (layered: future-by-sender; sequenced: 0.1 % of the pool), which
# would drop or stall them; this network has one trusted sender, so the whole pool may belong to it.
tx_pool = "SEQUENCED"
tx_pool_max_size = 200000         # > peak in-flight transactions (5,000 req/s x 2 s block x margin)
chain_id = 2026
# Well-known public Besu dev key, funded in the private genesis only. Never use on a public chain.
dev_private_key = "0x8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63"
dev_address = "0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"

[run]
region = "us-east-2"             # split full run (workers + provers, deploy/aws/launch_reps.sh): 2026-10-27 author: Ohio,
                                 #   spot ~half of Singapore, spot quota 1,000 vCPU. veredact-bench stays in [aws] region
zone = "us-east-2a"               # e1 worker + provers (cheapest m7i.48xlarge spot, 2026-10-28); others try it first too
prover_types = "m7i.48xlarge c7i.48xlarge"  # spot in this order, then the last on demand: same Xeon 8488C, 192 vCPU
prover_count = 2                 # 384 vCPU: the pool the quota allows (one pair)
prover_cap_min_per_run = 180     # prover hard limit = runs x this + 90 min boot (VeRedact-PQ Exp. 1 ~1.7 h per run)
e1_cap_min_per_run = 300         # e1 worker hard limit = runs x this + 60 (Exp. 1 of a run ~4 h, 28 Oct estimate)
part_cap_min = 720               # hard limit of every other part (one experiment of one run)
setup_cap_min = 90               # hard limit while a worker or the image builder is being set up
# Where finished runs go besides the instance disk. "" = keep on the instance; fetch with fetch_results.sh.
s3_uri = ""                      # e.g. "s3://<bucket>/veredact" (bucket must exist; the instance needs an IAM role)
idle_shutdown_minutes = 30       # idle watchdog: power off when no experiment has run for this long
