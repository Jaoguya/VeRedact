# Benchmark parameters (manuscript Table VII + experiment sweeps). Read by benchmark/veredact_bench/config.py.
# Values the manuscript still writes as [x] or [TBD] are provisional: change them here only.

[defaults]
n = 7                  # committee size            [7]
t = 5                  # threshold                 [5]
B_min = 8              # ABRRR lower bound         [8]
B_max = 256            # ABRRR upper bound         [256]
T_max_ms = 500.0       # max waiting time          [500] ms
N = 256                # leaves per tx batch       [256]
S = 16                 # SA-RLI shards             [16]
S_A = 16               # RAI shards                [16]
ledger_size = 100000   # transactions              [1e5]
zipf_s = 0.8           # target skew               [0.8]
payload_min = 256      # bytes
payload_max = 4096     # bytes
repetitions = 30       # runs, 95% CI

[tbd]                  # manuscript [TBD]; set once measured / decided
block_period_s = 2.0   # Besu QBFT block period
net_latency_ms = 10.0  # tc netem inter-node latency
vps_workers = 4        # parallel VPS validation workers
ch_dim = 256           # PQCH stand-in dimension
zk_prove_ms = 0.0      # requester-side, excluded from T_val
zk_verify_ms = 5.0     # STARK verify   [TBD: library]
zk_proof_bytes = 80000 # |pi|           [TBD: library]
policy_ms = 4.0        # T_Pol stand-in (policy-based CH authorization, baselines)

[paths]                # relative to the repository root
results = "results"
plots = "plot"

[exp1]
rates = [100, 250, 500, 1000, 2000, 5000]
zipf = [0.0, 0.4, 0.8, 1.2]
zipf_rate = 1000
fixed_batch = 64
duration_s = 10.0
bursty = { on_s = 2.0, off_s = 2.0, peak_factor = 4.0 }

[exp2]
committee = [4, 7, 10, 16, 32]   # t = floor(2n/3) + 1
batch_sizes = [1, 8, 32, 64, 128, 256]

[exp3]
n_Q = [10, 100, 1000, 10000]
records_per_batch = [1, 4, 16, 64]

[exp4]
n_Q = [10, 100, 1000, 10000]
levels = ["normal", "deep"]
inject = [0.01, 0.05, 0.10]

[exp5]
batch_sizes = [1, 8, 32, 64, 128, 256]
zipf = [0.0, 0.8]
