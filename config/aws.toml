# AWS experiment server. Read by deploy/aws/*.sh through deploy/aws/aws_config.py.
# Credentials are NOT stored here: scripts use the AWS CLI profile below (aws configure --profile <name>).

[aws]
profile = "default"              # AWS CLI profile with EC2 permissions
region = "ap-southeast-1"        # Singapore (closest to Thailand)
instance_type = "c7i.4xlarge"    # = config/experiment.toml [environment].instance_type (16 vCPU / 32 GiB)
volume_gb = 100
# Ubuntu 24.04 LTS, resolved at launch from the public SSM parameter (no hard-coded AMI id)
ami_ssm_parameter = "/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id"
key_name = "veredact-bench"      # EC2 key pair; created by provision_ec2.sh if missing (saved to ~/.ssh/)
ssh_user = "ubuntu"
ssh_cidr = "auto"                # "auto" = your current public IP/32 only
name_tag = "veredact-bench"

[repo]
url = "https://github.com/Jaoguya/VeRedact.git"
branch = "main"
remote_dir = "/opt/veredact"

[besu]
# Network shape (validators, block period, netem delay, RPC port) comes from config/<tier>.toml [ledger].
image = "hyperledger/besu:25.6.0"
chain_id = 2026
# Well-known public Besu dev key, funded in the private genesis only. Never use on a public chain.
dev_private_key = "0x8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63"
dev_address = "0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"

[run]
# Where finished runs go besides the instance disk. "" = keep on the instance; fetch with fetch_results.sh.
s3_uri = ""                      # e.g. "s3://<bucket>/veredact" (bucket must exist; the instance needs an IAM role)
idle_shutdown_minutes = 30       # idle watchdog: power off when no experiment has run for this long
