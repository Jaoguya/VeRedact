# Scheme registry: one entry per system in the VeRedact-PQ evaluation — bibliographic metadata, where its
# paper text lives, which experiments it enters and where its implementation is.
#
# Ids: S<n> = manuscript reference [n], PDF + full text in Scheme/S<n>_*/.
# Parameters are NOT here: every numeric parameter lives in config/{smoke,pilot,experiment}.toml
# [baselines.S<n>]. Capabilities are NOT here: they are reported by each implementation's
# Scheme.capabilities() (python -m veredact_bench capabilities), so they cannot drift from the code.
# experiments must agree with config/experiment.toml [experiments.expN].systems.

[meta]
manuscript = "overleaf/VeRedact.tex"
bibliography_updated = "2026-09-29"

[schemes.veredact]
label = "VeRedact-PQ"
ref = 0
experiments = [1, 2, 3, 4, 5]
variants = ["per_request", "fixed_batch", "no_bimc", "re_zk", "per_record_evidence"]
implementation = "benchmark/veredact_bench/protocol/veredact_scheme.py:VeRedactScheme"

[schemes.S1]
key = "li2025_dch"
label = "Li et al. [1] (Improved DCH)"
ref = 1
authors = "C. Li, Q. Shen, Z. Wu"
title = "Redactable Blockchain From Decentralized Chameleon Hash Functions, Revisited"
venue = "IEEE Trans. Computers 74(6), 2025"
doi = "10.1109/TC.2025.3544878"
folder = "Scheme/S1_Li2025_ImprovedDCH"
fulltext = "S1_fulltext.md"
summary = "S1_summary.md"
experiments = [1, 2, 3, 4, 5]
implementation = "experiment/S1_ImprovedDCH/s1_baseline.py:ImprovedDCHScheme"
boundaries = "docs/baselines/S1-improved-dch.md"

[schemes.S1.reproduction]      # experiment/S1_ImprovedDCH/s1_run.py — the paper's own Table II / Fig. 2
t_default = 5                  # [PROPOSED] Table II participant count (the paper reports per participant)
t_sweep = [5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45]   # [DERIVED] Fig. 2 x-axis 5..45
reps = 1000                    # [PROPOSED] median over reps for sub-ms operations
keygen_reps = 20               # [PROPOSED] DKG is O(t^2) and seconds long at t = 45: fewer reps suffice
[schemes.S1.reproduction.quick]
t_sweep = [5, 9, 13]
reps = 20
keygen_reps = 3

[schemes.S13]
key = "eaq_vrbc2025"
label = "EAQ-VRBC [13]"
ref = 13
authors = "X. Zhang, Z. Cai, K. Chen, G. Ha, C. Jia"
title = "Efficient Auditing and Querying in Verifiable Redactable Blockchain: A Lightweight VDS Protocol with Integrity Verification"
venue = "IEEE TrustCom 2025"
doi = "10.1109/Trustcom66490.2025.00062"
folder = "Scheme/S13_Zhang2025_EAQ-VRBC"
fulltext = "S13_fulltext.md"
summary = "S13_summary.md"
experiments = [1, 3, 4, 5]
implementation = "experiment/S13_EAQVRBC/s13_baseline.py:EAQVRBCScheme"
boundaries = "docs/baselines/S13-eaq-vrbc.md"

[schemes.S13.reproduction]     # experiment/S13_EAQVRBC/s13_run.py — the paper's own Figs. 4-9
rsa_bits = 2048                # [DERIVED] the paper's instantiation (reproduction, not the 3072-bit comparison)
miners = 4                     # [DERIVED] paper setup
l_bits = 256                   # [DERIVED] paper setup
challenged = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500]   # [DERIVED] Figs. 4/5 x-axis
audit_txs_per_block = 4        # [PROPOSED] block size for the audit ledger (paper does not state it)
query_index = [100, 300, 700, 1500, 3100, 6300, 12700, 25500, 51100]   # [DERIVED] Figs. 6/7 x-axis
query_txs_per_block = 1        # [PROPOSED] one tx per block isolates the index-depth effect
txs_per_block = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500]  # [DERIVED] Figs. 8/9 x-axis
revoked = 50                   # [PROPOSED] revocation-list size (paper does not state it)
reps = 30                      # [PROPOSED]
[schemes.S13.reproduction.quick]
challenged = [50, 100]
query_index = [100, 300]
txs_per_block = [50, 100]
reps = 5

[schemes.S27]
key = "liu2026_etch"
label = "Liu et al. [27] (ETCH)"
ref = 27
authors = "Z. Liu, B. Zhou, Y. Zhao"
title = "Enhancing Redactable Blockchain With Robust and Efficient Threshold Redaction"
venue = "IEEE TDSC 23(2), 2026"
doi = "10.1109/TDSC.2025.3634512"
folder = "Scheme/S27_Liu2026_ETCH"
fulltext = "S27_fulltext.md"
summary = "S27_summary.md"
experiments = [1, 2, 5]
implementation = "experiment/S27_ETCH/s27_baseline.py:ETCHScheme"
boundaries = "docs/baselines/S27-etch.md"

[schemes.S27.reproduction]     # experiment/S27_ETCH/s27_run.py — the paper's own Figs. 4-6
t_sweep = [3, 9, 15, 21, 27, 33]          # [DERIVED] Fig. 4 x-axis
redactors_sweep = [5, 10, 15, 20, 25, 30, 33]   # [DERIVED] Fig. 6 x-axis
rtt_ms = [20, 50, 100, 200, 300]          # [DERIVED] Fig. 6 series
adapt_rounds = 2               # [DERIVED] ETCH.Adapt has two CA rounds (Sec. V); see s27_run.py header
