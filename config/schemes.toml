# Global scheme registry: one entry per scheme that appears in the VeRedact-PQ manuscript evaluation.
# Single source of truth for: manuscript reference, paper metadata, where its converted text lives,
# which experiments use it, and the workflow the benchmark re-implements (read by benchmark/veredact_bench).
#
# Scheme ids:  S<n> = a paper we hold (PDF + full text in Scheme/), numbered in manuscript-ref order.
#              B-refNN = a baseline used in experiments whose PDF is NOT in Scheme/ yet.
#
# Workflow fields (one row of manuscript Table IV / Table V):
#   validate  : "sig" | "policy+sig"
#   authorize : "none" | "threshold_sign" | "policy" | "dch_approve" | "maabe_threshold"
#   adapt     : "central" | "threshold"
#   audit     : "" (none) | "threshold_sigs" | "sig_hash" | "vds_per_record" | "light"
#   onchain   : "hash" | "hash+sig"
# grounded   : "pdf" (checked against the paper) | "table-iv" (manuscript Table IV row only; TODO-VERIFY)

[meta]
manuscript = "overleaf/VeRedact.tex"
bibliography_updated = "2026-09-29"

