fig5_sha256_reps = 10000       # [PROPOSED] SHA-256 is ~1 us: 10x the reps of ETCH for a stable median
[schemes.S27.reproduction.quick]
t_sweep = [3, 9, 15]
redactors_sweep = [5, 10, 15]
reps = 20
keygen_reps = 2
fig5_sha256_reps = 200

