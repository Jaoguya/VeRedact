[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veredact_bench"
version = "2.0.0"
description = "VeRedact-PQ evaluation code (IEEE journal artefact): every table and figure from one config + one script"
requires-python = ">=3.12,<3.13"
# Pinned: the versions the paper's numbers were produced with. Change only together with a re-run.
dependencies = [
    "numpy==2.5.3",
    "omegaconf==2.3.0",               # YAML config composition (configs/)
    "pqcrypto==1.0.0",                # ML-DSA-65 laptop backend; the experiment tier requires liboqs (extra "server")
    "cryptography==50.0.1",           # RSA key generation for Schemes [1], [13], [34]
    "gmpy2==2.3.1",                   # RSA / accumulator arithmetic for Schemes [1], [13], [34]
    "coincurve==21.0.0",              # secp256k1 for Schemes [1], [27]
    "py_arkworks_bls12381==0.5.0",    # BLS12-381 pairings for Schemes [1], [34]
    "matplotlib==3.11.2",             # figures
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "maturin==1.15.0"]
# installed by deploy/server/bootstrap_server.sh: liboqs-python (built against liboqs 0.16.0), web3, py-solc-x
server = ["web3", "py-solc-x"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
