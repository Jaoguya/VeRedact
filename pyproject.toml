[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veredact_bench"
version = "2.0.0"
description = "VeRedact-PQ evaluation code (IEEE journal artefact): every table and figure from one config + one script"
requires-python = ">=3.12,<3.13"
# Pinned: the versions the paper's numbers were produced with. Change only together with a re-run.
dependencies = [
    "numpy==2.5.3",
    "omegaconf==2.3.0",               # YAML config composition (configs/)
    "pqcrypto==1.0.0",                # ML-DSA-65 laptop backend; the experiment tier requires liboqs (extra "server")
    "cryptography==50.0.1",           # RSA key generation for Schemes [1], [13], [34]
    "gmpy2==2.3.1",                   # RSA / accumulator arithmetic for Schemes [1], [13], [34]
    "coincurve==21.0.0",              # secp256k1 for Schemes [1], [27]
    "py_arkworks_bls12381==0.5.0",    # BLS12-381 pairings for Schemes [1], [34]
    "matplotlib==3.11.2",             # figures
    "scipy==1.18.1",                  # t-based confidence intervals (metrics/)
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "maturin==1.15.0", "ruff==0.16.10"]
# installed by deploy/server/bootstrap_server.sh: liboqs-python (built against liboqs 0.16.0), web3, py-solc-x
server = ["web3==8.0.0", "py-solc-x==2.0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # small lambdas are used as operation tables in exp00_primitives
    "E741",  # names l, I follow the papers' notation (policy attributes l, RADC binding I_i)
    "B905",  # zipped sequences are built together; strict= adds noise, not safety
]

[tool.ruff.lint.per-file-ignores]
# timing helpers call each lambda inside the same loop iteration, so the captured loop variable is current
"src/veredact_bench/methods/baselines/*/reproduce.py" = ["B023"]
"tools/*.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
