name: Question / problem
description: A problem or question that is not part of an existing task (for a task you are on, comment there instead)
labels: ["blocked"]
body:
  - type: textarea
    id: did
    attributes:
      label: What I did
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the error or log; long logs inside <details><summary>log</summary> ... </details>.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What I tried
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need, and from whom (@mention them)?
    validations:
      required: true
