name: Task
description: A piece of work someone (or their agent) can pick up
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checkable condition, e.g. "test X passes", "figure Y regenerated from run Z".
    validations:
      required: true
  - type: dropdown
    id: aws
    attributes:
      label: Needs AWS?
      description: If yes, a team member must approve each AWS action as a comment on this issue.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Files, experiments, papers, links.
