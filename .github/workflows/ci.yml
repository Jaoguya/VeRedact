name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Benchmark/pyproject.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Benchmark/native/pqzk_stark
      - name: Install (ML-DSA via pqcrypto; liboqs and Besu are server-only)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install ./native/pqzk_stark
      - name: Lint
        run: |
          ruff check src tests scripts deploy/aws/aws_config.py
          ruff format --check src tests scripts deploy/aws/aws_config.py
      - name: Tests (Besu-dependent tests skip without VRPQ_BESU_KEY)
        run: python -m pytest -q
